{% extends 'inventory/base.html' %}
{% block title %}Reset password{% endblock %}
{% block content %}
<header class="page-head"><h1>Reset password for {{ edited.username }}</h1></header>
<form method="post" class="panel form narrow">{% csrf_token %}
  {% include 'inventory/_fields.html' %}
  <div class="actions"><button class="btn primary">Set new password</button><a class="btn ghost" href="{% url 'user_list' %}">Cancel</a></div>
</form>
{% endblock %}
