{% extends 'inventory/base.html' %}
{% block title %}Edit {{ unit.name }}{% endblock %}
{% block content %}
<header class="page-head"><h1>Edit unit: {{ unit.name }}</h1></header>
<form method="post" class="panel form narrow">{% csrf_token %}
  {% include 'inventory/_fields.html' %}
  <div class="actions"><button class="btn primary">Save unit</button><a class="btn ghost" href="{% url 'unit_list' %}">Cancel</a></div>
</form>
{% endblock %}
