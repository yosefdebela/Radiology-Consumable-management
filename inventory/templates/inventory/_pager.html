{% if page.paginator.num_pages > 1 %}
<div class="pager">
  {% if page.has_previous %}<a class="btn small" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.previous_page_number }}">Previous</a>{% endif %}
  <span class="muted">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn small" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.next_page_number }}">Next</a>{% endif %}
</div>
{% endif %}
