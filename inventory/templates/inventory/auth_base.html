{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="application-name" content="Radiology consumables">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Radiology consumables{% endblock %}</title>
<link rel="stylesheet" href="{% static 'inventory/app.css' %}">
</head>
<body class="authpage">
<main class="authcard">
  <div class="brandline"><span class="brand-mark"></span><strong>Radiology consumables</strong></div>
  {% if messages %}<div class="messages">{% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
